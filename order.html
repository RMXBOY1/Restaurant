<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Order Details — Ember & Smoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
:root{--gold:#C9A84C;--gold-l:#E8C96A;--gold-d:#8B6914;--black:#090909;--dark:#111;--d2:#181818;--d3:#222;--white:#F5F0E8;--gray:#888;--fd:'Cormorant Garamond',serif;--fb:'Outfit',sans-serif;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:var(--fb);min-height:100vh;}

/* NAV */
.top-bar{background:rgba(9,9,9,.98);border-bottom:1px solid rgba(201,168,76,.12);padding:16px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);}
.logo{font-family:var(--fd);font-size:1.6rem;font-weight:700;color:var(--gold);text-decoration:none;letter-spacing:2px;}
.logo span{color:var(--white);}
.back-btn{display:flex;align-items:center;gap:8px;color:var(--gray);text-decoration:none;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;transition:color .3s;}
.back-btn:hover{color:var(--gold);}

/* HERO IMAGE SECTION */
.order-hero{position:relative;height:320px;overflow:hidden;}
.order-hero-img{width:100%;height:100%;object-fit:cover;display:block;}
.order-hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.2) 0%,rgba(9,9,9,1) 100%);}
.order-hero-badge{position:absolute;top:20px;left:20px;background:var(--gold);color:var(--black);font-size:.65rem;letter-spacing:2px;text-transform:uppercase;padding:6px 14px;font-weight:700;}
.order-id-badge{position:absolute;top:20px;right:20px;background:rgba(9,9,9,.85);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:.7rem;letter-spacing:2px;padding:6px 14px;backdrop-filter:blur(10px);}

/* MULTI ITEM PHOTOS */
.photos-strip{position:absolute;bottom:20px;left:20px;display:flex;gap:8px;}
.photo-thumb{width:64px;height:64px;border-radius:4px;object-fit:cover;border:2px solid rgba(201,168,76,.5);transition:all .3s;}
.photo-thumb:hover{border-color:var(--gold);transform:scale(1.08);}
.photo-thumb.active{border-color:var(--gold);border-width:3px;}

/* MAIN CONTENT */
.page-wrap{max-width:720px;margin:0 auto;padding:0 20px 60px;}

/* STATUS BAR */
.status-bar{background:var(--d2);border:1px solid rgba(201,168,76,.12);padding:20px 24px;margin-top:-2px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.status-left{display:flex;align-items:center;gap:12px;}
.status-dot{width:10px;height:10px;background:#4CAF50;border-radius:50%;animation:pulse-dot 2s ease infinite;}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,.4)}50%{box-shadow:0 0 0 8px rgba(76,175,80,0)}}
.status-text{font-size:.82rem;color:var(--white);}
.status-text strong{color:#4CAF50;}
.status-time{font-size:.75rem;color:var(--gray);}
.order-id-txt{font-size:.75rem;color:var(--gray);letter-spacing:1px;}

/* SECTION CARDS */
.card{background:var(--d2);border:1px solid rgba(201,168,76,.1);margin-top:16px;overflow:hidden;animation:fadeUp .6s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(2){animation-delay:.1s;}
.card:nth-child(3){animation-delay:.2s;}
.card:nth-child(4){animation-delay:.3s;}
.card-head{padding:18px 22px;border-bottom:1px solid rgba(201,168,76,.08);display:flex;align-items:center;gap:10px;}
.card-head i{color:var(--gold);font-size:1rem;}
.card-head h3{font-family:var(--fd);font-size:1.2rem;font-weight:600;}
.card-body{padding:18px 22px;}

/* CUSTOMER INFO */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.info-item{}
.info-lbl{font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--gray);margin-bottom:4px;}
.info-val{font-size:.9rem;color:var(--white);}
.info-val a{color:var(--gold);text-decoration:none;}

/* ORDER ITEMS */
.order-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(201,168,76,.07);}
.order-item:last-child{border-bottom:none;}
.oi-img{width:80px;height:80px;object-fit:cover;flex-shrink:0;border:1px solid rgba(201,168,76,.15);}
.oi-info{flex:1;}
.oi-name{font-family:var(--fd);font-size:1.15rem;font-weight:600;margin-bottom:4px;}
.oi-note{font-size:.75rem;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.oi-row{display:flex;align-items:center;justify-content:space-between;}
.oi-qty{font-size:.75rem;color:var(--gray);background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.18);padding:3px 10px;letter-spacing:1px;}
.oi-price{font-family:var(--fd);font-size:1.2rem;color:var(--gold);font-weight:600;}

/* BILL SUMMARY */
.bill-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(201,168,76,.06);font-size:.88rem;}
.bill-row:last-child{border-bottom:none;}
.bill-row .lbl{color:var(--gray);}
.bill-row .val{color:var(--white);}
.bill-total{display:flex;justify-content:space-between;align-items:center;padding:16px 0 0;margin-top:4px;border-top:2px solid rgba(201,168,76,.2);}
.bill-total .lbl{font-family:var(--fd);font-size:1.2rem;font-weight:600;}
.bill-total .val{font-family:var(--fd);font-size:1.5rem;color:var(--gold);font-weight:700;}

/* ACTION BUTTONS */
.actions{margin-top:24px;display:flex;flex-direction:column;gap:10px;}
.btn-wa{background:#25D366;color:#fff;border:none;padding:16px;font-family:var(--fb);font-size:.85rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;width:100%;}
.btn-wa:hover{background:#1ebe5d;}
.btn-copy{background:transparent;border:1px solid rgba(201,168,76,.3);color:var(--gold);padding:13px;font-family:var(--fb);font-size:.78rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
.btn-copy:hover{background:rgba(201,168,76,.08);border-color:var(--gold);}
.btn-back{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--gray);padding:12px;font-family:var(--fb);font-size:.76rem;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%;}
.btn-back:hover{border-color:rgba(255,255,255,.3);color:var(--white);}

/* ERROR STATE */
.error-state{text-align:center;padding:80px 20px;}
.error-state i{font-size:3rem;color:rgba(201,168,76,.3);margin-bottom:20px;display:block;}
.error-state h2{font-family:var(--fd);font-size:2rem;margin-bottom:12px;}
.error-state p{color:var(--gray);font-size:.9rem;line-height:1.7;}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--d3);border:1px solid rgba(201,168,76,.25);color:var(--white);padding:11px 22px;font-size:.8rem;z-index:20000;opacity:0;transition:all .4s ease;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{color:var(--gold);margin-right:8px;}

/* FOOTER */
.pg-foot{text-align:center;padding:30px 20px;border-top:1px solid rgba(201,168,76,.08);margin-top:40px;}
.pg-foot p{font-size:.75rem;color:rgba(136,136,136,.5);}
.pg-foot a{color:var(--gold);text-decoration:none;}

@media(max-width:600px){
  .order-hero{height:240px;}
  .info-grid{grid-template-columns:1fr;}
  .status-bar{flex-direction:column;align-items:flex-start;}
  .photos-strip{bottom:12px;left:12px;}
  .photo-thumb{width:52px;height:52px;}
}
</style>
</head>
<body>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="tmsg"></span></div>

<!-- TOP BAR -->
<div class="top-bar">
  <a href="index.html" class="logo">EMBER<span> & SMOKE</span></a>
  <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Menu</a>
</div>

<!-- DYNAMIC CONTENT -->
<div id="pageContent">
  <div style="text-align:center;padding:80px 20px;color:#888;">
    <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:#C9A84C;margin-bottom:16px;display:block;"></i>
    <p>Loading order details...</p>
  </div>
</div>

<script>
function getParam(name){
  const url=new URLSearchParams(window.location.search);
  return url.get(name);
}

function showToast(msg){
  document.getElementById('tmsg').textContent=msg;
  document.getElementById('toast').classList.add('show');
  setTimeout(()=>document.getElementById('toast').classList.remove('show'),2800);
}

function renderOrder(order){
  const heroImg = order.items[0].img;
  const thumbs = order.items.map((item,i)=>
    `<img src="${item.img}" class="photo-thumb ${i===0?'active':''}" onclick="changeHero('${item.img}',this)" title="${item.name}"/>`
  ).join('');

  const itemsHTML = order.items.map(item=>`
    <div class="order-item">
      <img src="${item.img}" alt="${item.name}" class="oi-img"/>
      <div class="oi-info">
        <div class="oi-name">${item.name}</div>
        ${item.note?`<div class="oi-note"><i class="fas fa-pen"></i>${item.note}</div>`:''}
        <div class="oi-row">
          <span class="oi-qty">x${item.qty}</span>
          <span class="oi-price">Rs. ${(item.price*item.qty).toLocaleString()}</span>
        </div>
      </div>
    </div>
  `).join('');

  const typeIcon = order.type==='Delivery'?'fa-motorcycle':order.type==='Pickup'?'fa-store':'fa-utensils';

  document.getElementById('pageContent').innerHTML = `
    <!-- HERO -->
    <div class="order-hero">
      <img src="${heroImg}" alt="Order" class="order-hero-img" id="heroImg"/>
      <div class="order-hero-overlay"></div>
      <div class="order-hero-badge"><i class="fas fa-fire"></i> Live Order</div>
      <div class="order-id-txt order-id-badge">${order.id}</div>
      ${order.items.length>1?`<div class="photos-strip">${thumbs}</div>`:''}
    </div>

    <div class="page-wrap">
      <!-- STATUS -->
      <div class="status-bar card" style="margin-top:0;border-top:none;">
        <div class="status-left">
          <div class="status-dot"></div>
          <div class="status-text">Order <strong>Received</strong> — Ember & Smoke</div>
        </div>
        <div class="status-time"><i class="fas fa-clock" style="color:var(--gold);margin-right:5px;"></i>${order.time}</div>
      </div>

      <!-- CUSTOMER INFO -->
      <div class="card">
        <div class="card-head"><i class="fas fa-user"></i><h3>Customer Details</h3></div>
        <div class="card-body">
          <div class="info-grid">
            <div class="info-item"><div class="info-lbl">Name</div><div class="info-val">${order.name}</div></div>
            <div class="info-item"><div class="info-lbl">Phone</div><div class="info-val"><a href="tel:${order.phone}">${order.phone}</a></div></div>
            <div class="info-item"><div class="info-lbl">Order Type</div><div class="info-val"><i class="fas ${typeIcon}" style="color:var(--gold);margin-right:6px;"></i>${order.type}</div></div>
            ${order.address?`<div class="info-item"><div class="info-lbl">Delivery Address</div><div class="info-val">${order.address}</div></div>`:''}
          </div>
        </div>
      </div>

      <!-- ORDER ITEMS -->
      <div class="card">
        <div class="card-head"><i class="fas fa-utensils"></i><h3>Ordered Items <span style="color:var(--gold);font-size:.85rem;">(${order.items.reduce((s,i)=>s+i.qty,0)} items)</span></h3></div>
        <div class="card-body">${itemsHTML}</div>
      </div>

      <!-- BILL -->
      <div class="card">
        <div class="card-head"><i class="fas fa-receipt"></i><h3>Bill Summary</h3></div>
        <div class="card-body">
          <div class="bill-row"><span class="lbl">Subtotal</span><span class="val">Rs. ${order.subtotal.toLocaleString()}</span></div>
          ${order.delivery?`<div class="bill-row"><span class="lbl"><i class="fas fa-motorcycle" style="margin-right:5px;color:var(--gold);"></i>Delivery Charges</span><span class="val">Rs. ${order.delivery.toLocaleString()}</span></div>`:''}
          <div class="bill-total"><span class="lbl">Total Amount</span><span class="val">Rs. ${order.total.toLocaleString()}</span></div>
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <a href="https://wa.me/923008909105?text=${encodeWA(order)}" class="btn-wa" target="_blank">
          <i class="fab fa-whatsapp"></i> Chat with Restaurant on WhatsApp
        </a>
        <button class="btn-copy" onclick="copyLink()">
          <i class="fas fa-copy"></i> Copy Order Link
        </button>
        <a href="index.html" class="btn-back">
          <i class="fas fa-arrow-left"></i> Back to Menu
        </a>
      </div>
    </div>

    <div class="pg-foot">
      <p>Powered by <a href="index.html">Ember & Smoke</a> &nbsp;&bull;&nbsp; For support call <a href="tel:+923008909105">+92 300 890 9105</a></p>
    </div>
  `;
}

function changeHero(src, el){
  document.getElementById('heroImg').src = src;
  document.querySelectorAll('.photo-thumb').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function encodeWA(order){
  const lines = order.items.map(i=>`  • ${i.name} x${i.qty} = Rs. ${(i.price*i.qty).toLocaleString()}${i.note?' ['+i.note+']':''}`).join('%0A');
  let msg = `🍽️ *Order Ref: ${order.id}*%0A`;
  msg += `👤 *${order.name}* | 📱 ${order.phone}%0A`;
  msg += `🛵 *${order.type}*`;
  if(order.address) msg += ` | 📍 ${order.address}`;
  msg += `%0A━━━━━━━━━━━━━━━━━━%0A`;
  msg += lines + `%0A━━━━━━━━━━━━━━━━━━%0A`;
  msg += `✅ *TOTAL: Rs. ${order.total.toLocaleString()}*`;
  return msg;
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href).then(()=>{
    showToast('Order link copied!');
  }).catch(()=>{
    const el = document.createElement('textarea');
    el.value = window.location.href;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    showToast('Order link copied!');
  });
}

function showError(){
  document.getElementById('pageContent').innerHTML = `
    <div class="page-wrap">
      <div class="error-state">
        <i class="fas fa-exclamation-circle"></i>
        <h2>Order Not Found</h2>
        <p>This order link is invalid or has expired.<br/>Please place a new order from our menu.</p>
        <a href="index.html" style="display:inline-block;margin-top:24px;background:var(--gold);color:var(--black);padding:14px 32px;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;text-decoration:none;font-weight:700;">Go to Menu</a>
      </div>
    </div>
  `;
}

// INIT
window.addEventListener('DOMContentLoaded',()=>{
  const d = getParam('d');
  if(!d){ showError(); return; }
  try{
    const order = JSON.parse(decodeURIComponent(escape(atob(d))));
    if(!order||!order.items||!order.items.length){ showError(); return; }
    renderOrder(order);
  }catch(e){
    showError();
  }
});
</script>
</body>
</html>
